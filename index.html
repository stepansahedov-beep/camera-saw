<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera_saw</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #151922;
      color: white;
      text-align: center;
      padding: 20px;
    }
    main {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #222936;
      border-radius: 16px;
    }
    video, canvas {
      width: 100%;
      margin-top: 12px;
      border-radius: 10px;
      background: #080b10;
    }
    button, a {
      display: inline-block;
      margin: 6px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button { background: #4b8cff; color: white; }
    #status { color: #cbd5e1; }
  </style>
</head>
<body>
<main>
  <h1>📷 Camera_saw</h1>
  <p>
    Камера вмикається після натискання кнопки.
    Фото та відео не надсилаються автоматично.
  </p>

  <button id="start">Увімкнути камеру</button>
  <button id="stop" disabled>Вимкнути камеру</button>

  <video id="camera" autoplay playsinline muted></video>

  <div>
    <button id="photo" disabled>Зробити фото</button>
    <button id="record" disabled>Записати відео</button>
    <button id="finish" disabled>Зупинити відео</button>
  </div>

  <p id="status">Камера вимкнена.</p>
  <canvas id="picture" hidden></canvas>
  <div id="photoDownload"></div>
  <video id="result" controls playsinline hidden></video>
  <div id="videoDownload"></div>
</main>

<script>
const camera = document.querySelector("#camera");
const start = document.querySelector("#start");
const stop = document.querySelector("#stop");
const photo = document.querySelector("#photo");
const record = document.querySelector("#record");
const finish = document.querySelector("#finish");
const status = document.querySelector("#status");
const picture = document.querySelector("#picture");
const result = document.querySelector("#result");

let stream;
let recorder;
let chunks = [];
let photoURL;
let videoURL;

start.onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });
    camera.srcObject = stream;
    start.disabled = true;
    stop.disabled = false;
    photo.disabled = false;
    record.disabled = false;
    status.textContent = "Камера увімкнена.";
  } catch {
    status.textContent =
      "Камеру не вдалося ввімкнути. Перевір дозвіл браузера.";
  }
};

stop.onclick = () => {
  if (stream) stream.getTracks().forEach(track => track.stop());
  stream = null;
  camera.srcObject = null;
  start.disabled = false;
  stop.disabled = true;
  photo.disabled = true;
  record.disabled = true;
  finish.disabled = true;
  status.textContent = "Камера вимкнена.";
};

photo.onclick = () => {
  if (!camera.videoWidth) return;
  picture.width = camera.videoWidth;
  picture.height = camera.videoHeight;
  picture.getContext("2d").drawImage(camera, 0, 0);
  picture.hidden = false;

  picture.toBlob(blob => {
    if (!blob) return;
    if (photoURL) URL.revokeObjectURL(photoURL);
    photoURL = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = photoURL;
    link.download = "camera_saw_photo.jpg";
    link.textContent = "Зберегти фото";
    document.querySelector("#photoDownload").replaceChildren(link);
    status.textContent = "Переглянь фото перед збереженням.";
  }, "image/jpeg");
};

record.onclick = () => {
  if (!stream || !window.MediaRecorder) {
    status.textContent = "Запис відео не підтримується.";
    return;
  }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = event => {
    if (event.data.size) chunks.push(event.data);
  };
  recorder.onstop = () => {
    const blob = new Blob(chunks, {
      type: recorder.mimeType || "video/webm"
    });
    if (videoURL) URL.revokeObjectURL(videoURL);
    videoURL = URL.createObjectURL(blob);
    result.src = videoURL;
    result.hidden = false;
    const link = document.createElement("a");
    link.href = videoURL;
    link.download = "camera_saw_video.webm";
    link.textContent = "Зберегти відео";
    document.querySelector("#videoDownload").replaceChildren(link);
    status.textContent = "Переглянь відео перед збереженням.";
    record.disabled = false;
  };
  recorder.start();
  record.disabled = true;
  finish.disabled = false;
  status.textContent = "Відео записується.";
};

finish.onclick = () => {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  finish.disabled = true;
};
</script>
</body>
</html>
