<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera_saw — сюрприз</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #101014;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
      border-radius: 20px;
      background: #202027;
      text-align: center;
    }
    p { line-height: 1.5; color: #ddd; }
    video, img {
      width: 100%;
      margin-top: 12px;
      border-radius: 12px;
      background: #080808;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #fe315d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .secondary { background: #41414d; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Camera_saw 😂</h1>

  <section id="intro">
    <p>
      Це жартова сторінка. Якщо продовжиш, камера відкриється
      для попереднього перегляду. Фото не буде надіслано
      без твоєї окремої згоди.
    </p>
    <button id="start">Відкрити камеру</button>
  </section>

  <section id="camera" hidden>
    <video id="video" autoplay playsinline muted></video>
    <button id="take">Зробити фото</button>
  </section>

  <section id="preview" hidden>
    <h2>Перевір своє фото</h2>
    <img id="photo" alt="Попередній перегляд фото">
    <p>
      Якщо натиснеш «Підтвердити», фото буде передано
      власнику бота. Якщо не хочеш його надсилати,
      натисни «Скасувати».
    </p>
    <button id="confirm">Підтвердити надсилання</button>
    <button id="cancel" class="secondary">Скасувати</button>
    <p id="status" role="status"></p>
  </section>
</main>

<script>
const start = document.getElementById("start");
const video = document.getElementById("video");
const camera = document.getElementById("camera");
const preview = document.getElementById("preview");
const photo = document.getElementById("photo");
const status = document.getElementById("status");

let stream = null;
let photoBlob = null;

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
}

start.addEventListener("click", async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });
    video.srcObject = stream;
    document.getElementById("intro").hidden = true;
    camera.hidden = false;
  } catch (error) {
    alert("Не вдалося відкрити камеру. Перевір дозвіл браузера.");
  }
});

document.getElementById("take").addEventListener("click", () => {
  if (!video.videoWidth || !video.videoHeight) {
    alert("Камера ще не готова. Спробуй знову.");
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  canvas.toBlob(blob => {
    if (!blob) {
      alert("Не вдалося створити фото.");
      return;
    }
    photoBlob = blob;
    photo.src = URL.createObjectURL(blob);
    stopCamera();
    camera.hidden = true;
    preview.hidden = false;
  }, "image/jpeg", 0.9);
});

document.getElementById("cancel").addEventListener("click", () => {
  photoBlob = null;
  photo.removeAttribute("src");
  preview.hidden = true;
  document.getElementById("intro").hidden = false;
  status.textContent = "Фото не надіслано.";
});

// Кнопка подтверждения: отправляет фото на Flask (порт 5000)
document.getElementById("confirm").addEventListener("click", async () => {
  if (!photoBlob) {
    status.textContent = "Помилка: фото не знайдено.";
    return;
  }

  status.textContent = "Надсилання фото на сервер...";

  const formData = new FormData();
  // Поле 'photo' должно совпадать с тем, что ожидает Flask (request.files['photo'])
  formData.append("photo", photoBlob, "user_photo.jpg");

  try {
    // Делаем запрос к вашему Flask-серверу на порт 5000
    const response = await fetch("http://127.0.0", {
      method: "POST",
      body: formData
    });

    if (response.ok) {
      // Меняем контент страницы на сообщение о розыгрыше
      const mainContainer = document.querySelector("main");
      mainContainer.innerHTML = `
        <h1>Тебе пранканули! 😂</h1>
        <p>Твоє фото було успішно надіслано в Telegram-чат власника сайту.</p>
      `;
    } else {
      status.textContent = `Помилка сервера: ${response.status}`;
    }
  } catch (error) {
    console.error("Помилка:", error);
    status.textContent = "Не вдалося зв'язатися з сервером. Перевірте, чи запущено файл photo_server.py";
  }
});
</script>
</body>
</html>
